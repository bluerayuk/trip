<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itinerary Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="tab-explore">
<div class="page">

  <h1 id="tripHeading" class="sr-only">Trip itinerary</h1>

  <!-- Mobile-only: a persistent top bar, pinned to the top of the screen so it
       stays visible after scrolling past the trip card below. On phones,
       app.js (syncTopbarPlacement) moves the trip picker (.trip-select-wrap)
       in before the price and the ⋮ menu in after it, giving
       [ trip picker ] [ price ] [ ⋮ ]; on wider screens they go back to the
       trip bar. The price badge mirrors #budgetTotal's value (updated in the
       same place in app.js); it's purely informational, so it's aria-hidden
       to avoid double-announcing the total that's already in the trip bar. -->
  <div class="mobile-topbar" id="mobileTopbar">
    <div class="sticky-total-badge" id="stickyTotalBadge" aria-hidden="true">
      <span id="stickyTotalValue">$0</span>
    </div>
    <button type="button" class="topbar-search-btn" id="searchToggleBtn" onclick="toggleSearch()" aria-label="Search stops" aria-expanded="false" aria-controls="searchInput" title="Search stops">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-filter-wrap" id="filterMenuWrap">
      <button type="button" class="topbar-search-btn" id="filterToggleBtn" onclick="toggleFilterMenu()" aria-haspopup="true" aria-expanded="false" aria-controls="filterMenu" aria-label="Filter by category" title="Filter by category">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5L3 5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <div class="trip-more-menu filter-menu" id="filterMenu" role="menu"><!-- filled by JS --></div>
    </div>
    <div class="topbar-filter-wrap" id="viewMenuWrap">
      <button type="button" class="topbar-search-btn" id="viewToggleBtn" onclick="toggleViewMenu()" aria-haspopup="true" aria-expanded="false" aria-controls="viewMenu" aria-label="Change view" title="Change view"><!-- current view icon, set by JS --></button>
      <div class="trip-more-menu filter-menu view-menu" id="viewMenu" role="menu"><!-- filled by JS --></div>
    </div>
  </div>

  <!-- On mobile this wraps the trip bar, the collapsible sharing/packages
       panel, and (previously) the packages bar into one visual card with
       internal dividers, instead of several separate stacked cards (see
       .mobile-summary-card in styles.css). On desktop it's display:contents,
       so everything still reads as independent bars, just as before. -->
  <div class="mobile-summary-card">
  <div class="trip-bar">
    <div class="trip-select-wrap">
      <select id="tripSelect" aria-label="Select trip"></select>
      <button class="icon-text-btn" id="newTripBtn" onclick="createTrip()" title="New trip" aria-label="New trip">+<span class="btn-label"> New</span></button>
      <div class="trip-admin-btns">
        <button class="icon-text-btn" onclick="renameTrip()" title="Rename trip">Rename</button>
        <button class="icon-text-btn danger" onclick="deleteTrip()" title="Delete trip">Delete</button>
      </div>
    </div>
    <div class="trip-status-row">
      <span class="save-indicator" id="saveIndicator"><span class="dot"></span><span id="saveText">Saved</span></span>
      <span class="budget-total" id="budgetTotal"><span>Est. total</span>$0</span>
    </div>

    <!-- Mobile-only: Shared trip + Packages tuck behind this disclosure so
         the header leads with just the trip picker and its cost/status at
         a glance, instead of always showing every control. Desktop hides
         this toggle and shows the panel below inline, unchanged in
         substance (see .trip-details-toggle/.trip-details-panel in
         styles.css). Nothing here changes what any control does, only how
         much is visible before you ask for it. -->
    <button type="button" class="trip-details-toggle" id="tripDetailsToggle" onclick="toggleTripDetails()" aria-expanded="false" aria-controls="tripDetailsPanel">
      <span id="tripDetailsToggleText">Packages</span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="trip-bar-right">
      <button class="icon-text-btn" onclick="exportJson()">Export JSON</button>
      <button class="icon-text-btn" onclick="document.getElementById('importInput').click()">Import JSON</button>
      <input type="file" id="importInput" accept="application/json" style="display:none;" onchange="importJson(event)">
      <button class="icon-text-btn" onclick="resetToSample()">Reset to sample</button>
      <button class="icon-text-btn danger" onclick="clearAllStops()">Clear all</button>
    </div>

    <!-- Mobile-only: the six admin/data actions above collapse into this
         single overflow menu so the first screen leads with the trip
         itself, not a wall of equally-weighted buttons. Calls the exact
         same functions as their full-size counterparts above; nothing
         about what these buttons DO has changed, only how they're
         grouped on narrow screens (see .trip-more-wrap in styles.css). -->
    <div class="trip-more-wrap">
      <button type="button" class="icon-only-btn trip-more-btn" id="tripMoreBtn" onclick="toggleTripMoreMenu()" aria-haspopup="true" aria-expanded="false" title="More trip actions" aria-label="More trip actions">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></svg>
      </button>
      <div class="trip-more-menu" id="tripMoreMenu">
        <button type="button" class="trip-more-item" onclick="openAddFromMenu()">Add attraction</button>
        <div class="trip-more-divider"></div>
        <button type="button" class="trip-more-item" onclick="createTrip(); toggleTripMoreMenu(false)">New trip</button>
        <button type="button" class="trip-more-item" onclick="renameTrip(); toggleTripMoreMenu(false)">Rename trip</button>
        <button type="button" class="trip-more-item danger" onclick="deleteTrip(); toggleTripMoreMenu(false)">Delete trip</button>
        <div class="trip-more-divider"></div>
        <button type="button" class="trip-more-item trip-more-shared" id="sharedMenuItem" role="menuitemcheckbox" aria-checked="false" onclick="toggleSharedFromMenu()">
          <span>Shared trip</span><span class="trip-more-check" aria-hidden="true">✓</span>
        </button>
        <div class="trip-more-divider"></div>
        <button type="button" class="trip-more-item" onclick="copyItinerary(); toggleTripMoreMenu(false)">Copy list</button>
        <button type="button" class="trip-more-item" onclick="window.print(); toggleTripMoreMenu(false)">Print</button>
        <div class="trip-more-divider"></div>
        <button type="button" class="trip-more-item" onclick="exportJson(); toggleTripMoreMenu(false)">Export JSON</button>
        <button type="button" class="trip-more-item" onclick="document.getElementById('importInput').click(); toggleTripMoreMenu(false)">Import JSON</button>
        <button type="button" class="trip-more-item" onclick="resetToSample(); toggleTripMoreMenu(false)">Reset to sample</button>
        <button type="button" class="trip-more-item danger" onclick="clearAllStops(); toggleTripMoreMenu(false)">Clear all</button>
      </div>
    </div>
  </div>

  <div class="trip-details-panel" id="tripDetailsPanel">
    <label class="shared-toggle">
      <input type="checkbox" id="sharedToggle" onchange="toggleShared()">
      Shared trip
    </label>
    <span class="shared-badge" id="sharedBadge">Visible to all users</span>
    <div class="packages-bar" id="packagesBar" style="display:none;">
      <span class="packages-label">Packages</span>
      <div class="packages-list" id="packagesList"></div>
      <button class="icon-text-btn" onclick="createPackage()" title="Create a new package">+ New package</button>
    </div>
  </div>
  </div>

  <div class="view-tabs" role="tablist" aria-label="Attractions">
    <button type="button" class="view-tab active" id="tabExplore" role="tab" aria-selected="true" onclick="setTab('explore')">Explore</button>
    <button type="button" class="view-tab" id="tabMyList" role="tab" aria-selected="false" onclick="setTab('mylist')">My attractions <span class="view-tab-count" id="tabMyListCount">0</span></button>
  </div>

  <div class="control-panel-wrap" id="controlPanelWrap">
  <div class="control-panel" id="controlPanel">
    <div class="control-panel-title">
      <h2 id="formTitle">Add a stop</h2>
      <span class="edit-badge" id="editBadge" style="display:none;">Editing</span>
    </div>

    <div class="field half-width">
      <label for="placeName">Attraction name</label>
      <input type="text" id="placeName" placeholder="e.g. Montauk Point Lighthouse" required>
    </div>
    <div class="field">
      <label for="placeCategory">Category</label>
      <select id="placeCategory">
        <option value="sightseeing">Attractions</option>
        <option value="dining">Food & Drink</option>
        <option value="outdoors">Outdoors & Nature</option>
        <option value="skyscrapers">City & Architecture</option>
        <option value="museums-culture">Culture & Museums</option>
        <option value="entertainment-nightlife">Entertainment & Nightlife</option>
        <option value="shopping">Shopping</option>
        <option value="viewpoints-photography">Views & Photography</option>
      </select>
    </div>
    <div class="field">
      <label for="placeDay">Day</label>
      <input type="text" id="placeDay" placeholder="e.g. Day 1">
    </div>

    <div class="field full-width">
      <label for="placeSummary">Short description <span class="hint">(shown on the card — what the place IS, not tips — 150 characters max)</span></label>
      <textarea id="placeSummary" rows="2" maxlength="150" placeholder="e.g. A 305-foot copper statue on Liberty Island, one of America's most iconic landmarks." oninput="updateSummaryCharCount()"></textarea>
      <span class="char-count" id="summaryCharCount">0/150</span>
    </div>

    <div class="field half-width">
      <label for="placeAddress">Address</label>
      <input type="text" id="placeAddress" placeholder="Street, city — or paste a Google Maps link for an exact pin" onpaste="setTimeout(handleAddressPaste, 0)">
    </div>
    <div class="field half-width">
      <label for="placeWebsite">Official website <span class="hint">(optional — for opening times, tickets, etc.)</span></label>
      <input type="url" id="placeWebsite" placeholder="https://...">
    </div>
    <div class="field">
      <label for="placeCost">Cost ($)</label>
      <input type="number" id="placeCost" placeholder="0" min="0" step="0.01">
    </div>
    <div class="field">
      <label for="placeRating">Rating <span class="hint">(optional — or click the stars on the card once it's added)</span></label>
      <input type="number" id="placeRating" placeholder="4.7" min="0" max="5" step="0.1">
    </div>
    <div class="field full-width">
      <label for="placePackage">Package <span class="hint">(optional — group stops that share one price)</span></label>
      <select id="placePackage" onchange="handlePackageSelectChange()">
        <option value="">No package — pay individually</option>
        <option value="__new__">+ New package…</option>
      </select>
      <p class="package-hint" id="packagePriceHint" style="display:none;"></p>
    </div>

    <div class="field full-width">
      <label for="placeImage">Cover photo <span class="hint">(optional — paste an image URL)</span></label>
      <div class="image-input-row">
        <input type="text" id="placeImage" placeholder="https://..." oninput="handleImageUrlInput()">
        <div class="image-preview-wrap">
          <img id="imagePreview" class="image-preview" alt="Preview" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

    <div class="field full-width">
      <label for="galleryUrlInput">Gallery photos <span class="hint">(optional — extra photos people can browse in the detail view)</span></label>
      <div class="gallery-add-row">
        <textarea id="galleryUrlInput" rows="2" placeholder="Paste one or more image URLs here (one per line, or comma-separated), then click Add" onkeydown="handleGalleryInputKeydown(event)"></textarea>
        <button type="button" class="icon-text-btn" onclick="addGalleryUrls()">+ Add photo(s)</button>
      </div>
      <div class="gallery-input-list" id="galleryInputList"></div>
    </div>

    <div class="field full-width">
      <label for="placeDesc">Tips &amp; tricks <span class="hint">(only shown when someone taps "View insider tips" on the card)</span></label>
      <textarea id="placeDesc" rows="2" placeholder="Reservation details, insider tips, what to bring..."></textarea>
    </div>

    <div class="form-actions">
      <button class="cancel-btn" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
      <button class="add-btn" id="submitBtn" onclick="submitForm()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        Add stop
      </button>
    </div>
  </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="add-stop-toggle-btn" id="addStopToggleBtn" onclick="toggleAddPanel()" aria-expanded="false" aria-controls="controlPanelWrap" aria-label="Add a stop">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" id="addStopToggleIcon"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="addStopToggleLabel">Add a stop</span>
      </button>
      <div class="search-input-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search stops..." oninput="renderPlaces()">
      </div>
      <div class="filter-group" role="group" aria-label="Filter by category" id="filterGroup">
        <button class="pill-btn active" data-filter="all">All</button>
        <button class="pill-btn" data-filter="sightseeing">Attractions</button>
        <div class="filter-more" id="filterMore">
          <button class="filter-more-toggle" id="filterMoreToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="filterMoreMenu">
            <span id="filterMoreLabel">More</span>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="filter-more-menu" id="filterMoreMenu" role="menu">
            <button class="pill-btn" data-filter="dining">Food & Drink</button>
            <button class="pill-btn" data-filter="outdoors">Outdoors & Nature</button>
            <button class="pill-btn" data-filter="skyscrapers">City & Architecture</button>
            <button class="pill-btn" data-filter="museums-culture">Culture & Museums</button>
            <button class="pill-btn" data-filter="entertainment-nightlife">Entertainment & Nightlife</button>
            <button class="pill-btn" data-filter="shopping">Shopping</button>
            <button class="pill-btn" data-filter="viewpoints-photography">Views & Photography</button>
          </div>
        </div>
      </div>
    </div>
    <div class="toolbar-right">
      <label class="switch-label"><input type="checkbox" id="groupByDayToggle" onchange="renderPlaces()"> Group by day</label>
      <div class="view-toggle" role="group" aria-label="Change view" id="viewToggle">
        <button class="pill-btn active" data-view="grid">Grid</button>
        <button class="pill-btn" data-view="map">Map</button>
        <button class="pill-btn" data-view="split">Split</button>
      </div>
      <button class="toolbar-btn" onclick="copyItinerary()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 16V6a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.6"/></svg>
        Copy list
      </button>
      <button class="toolbar-btn" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2M6 14h12v7H6v-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Print
      </button>
    </div>
  </div>

  <div class="mylist-section" id="myListSection">
    <div class="mylist-header">
      <h2>My attractions</h2>
      <span class="budget-total" id="myListBudgetTotal"></span>
    </div>
    <div class="mylist-grid grid-container" id="myListGrid"></div>
    <p class="mylist-empty" id="myListEmpty">Nothing added yet. Tap the bookmark on any attraction in Explore to add it here.</p>
  </div>

  <div id="viewContainer" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:1.5rem;">
    <!-- Rendered by JS -->
  </div>

  <div class="detail-modal-overlay" id="detailModalOverlay" onmousedown="if(event.target===this) closeDetailModal()">
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <button class="detail-modal-close" id="detailModalCloseBtn" onclick="closeDetailModal()" aria-label="Close details">×</button>
      <div id="detailModalBody"><!-- filled by JS --></div>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightboxOverlay" onmousedown="if(event.target===this) closeLightbox()">
    <button class="lightbox-close" id="lightboxCloseBtn" onclick="closeLightbox()" aria-label="Close gallery">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxStep(-1)" aria-label="Previous photo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 4l-8 8 8 8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="lightbox-stage">
      <img id="lightboxImage" src="" alt="">
      <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>
    <button class="lightbox-nav lightbox-next" onclick="lightboxStep(1)" aria-label="Next photo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 4l8 8-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="sr-only" aria-live="polite" id="liveRegion"></div>

</div>

<script src="sample-places.js"></script>
<script src="sample-packages.js"></script>
<script src="my-list.js"></script>
<script src="drag-drop.js"></script>
<script src="export-import.js"></script>
<script src="maps-link.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.js"></script>
<script src="map-view.js"></script>
<script src="nearest.js"></script>
<script src="app.js"></script>
</body>
</html>
